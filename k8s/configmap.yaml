apiVersion: v1
kind: ConfigMap
metadata:
  name: fitlife-config
  namespace: fitlife
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  REDIS_CONNECTION_STRING: "redis-service:6379"
  CORS_ALLOWED_ORIGINS: "https://fitlife.example.com,https://www.fitlife.example.com"
  JWT_ISSUER: "FitLife.Api"
  JWT_AUDIENCE: "FitLife.Client"
  JWT_EXPIRATION_HOURS: "24"
  # Rate limiting identifies clients by the address the ingress controller appends.
  # Set the CIDR to the cluster's ingress/pod network before applying.
  ReverseProxy__TrustForwardedHeaders: "true"
  ReverseProxy__KnownNetworks__0: "10.0.0.0/8"
