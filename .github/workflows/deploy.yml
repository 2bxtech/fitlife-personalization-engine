name: FitLife CI and Disabled Azure Deployment

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_REGISTRY: fitlifeacr.azurecr.io
  AKS_CLUSTER_NAME: fitlife-aks
  AKS_RESOURCE_GROUP: fitlife-rg
  API_IMAGE_NAME: fitlife-api
  WEB_IMAGE_NAME: fitlife-web

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      # Per-run throwaway password for the disposable service container (not a secret).
      MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Ci-${{ github.run_id }}-${{ github.run_attempt }}-Aa1!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run backend tests (including SQL Server concurrency and dedup tests)
      env:
        FITLIFE_SQLSERVER_TEST_CONNECTION: Server=localhost,1433;User Id=sa;Password=${{ env.MSSQL_SA_PASSWORD }};TrustServerCertificate=True;
      run: |
        set -o pipefail
        dotnet test --no-build --verbosity normal --configuration Release | tee test-output.log
        # SQL-gated tests skip when the connection is missing; in CI that is a failure.
        # 'normal' verbosity lists each skipped test and a 'Skipped: N' summary line.
        if grep -Eq '^[[:space:]]*Skipped[[:space:]:]' test-output.log; then
          echo "::error::Backend tests were skipped; the SQL Server service was not used."
          exit 1
        fi

  test-frontend:
    name: Frontend Lint, Tests & Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: fitlife-web/package-lock.json

    - name: Install dependencies
      run: npm ci --legacy-peer-deps
      working-directory: fitlife-web

    - name: Lint
      run: npm run lint
      working-directory: fitlife-web

    - name: Run tests
      run: npm test
      working-directory: fitlife-web

    - name: Build production frontend
      run: npm run build
      working-directory: fitlife-web

    - name: Audit production dependencies
      run: npm audit --omit=dev --audit-level=high
      working-directory: fitlife-web

  build-and-push-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest
    needs: [test, test-frontend]
    if: false  # Disabled until Azure resources are provisioned
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ACR_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Extract branch name
      shell: bash
      run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

    - name: Build and push API Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./FitLife.Api/Dockerfile
        push: true
        tags: |
          ${{ env.ACR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ env.BRANCH_NAME }}-${{ github.sha }}
          ${{ env.ACR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ env.BRANCH_NAME }}-latest
        cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:buildcache,mode=max

  build-and-push-web:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    needs: [test, test-frontend]
    if: false  # Disabled until Azure resources are provisioned
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Azure Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.ACR_REGISTRY }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Extract branch name
      shell: bash
      run: echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV

    - name: Build and push Web Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./fitlife-web
        file: ./fitlife-web/Dockerfile
        push: true
        tags: |
          ${{ env.ACR_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ env.BRANCH_NAME }}-${{ github.sha }}
          ${{ env.ACR_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:${{ env.BRANCH_NAME }}-latest
        cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:buildcache
        cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:buildcache,mode=max

  deploy-staging:
    name: Deploy to Staging (Development Branch)
    runs-on: ubuntu-latest
    needs: [build-and-push-api, build-and-push-web]
    if: false  # Disabled until Azure resources are provisioned
    environment:
      name: staging
      url: https://staging.fitlife.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ env.AKS_CLUSTER_NAME }}

    - name: Deploy to staging namespace
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml -n fitlife-staging
        
        # Update image tags
        kubectl set image deployment/fitlife-api api=${{ env.ACR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:development-${{ github.sha }} -n fitlife-staging
        kubectl set image deployment/fitlife-web web=${{ env.ACR_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:development-${{ github.sha }} -n fitlife-staging
        
        # Wait for rollout
        kubectl rollout status deployment/fitlife-api -n fitlife-staging --timeout=5m
        kubectl rollout status deployment/fitlife-web -n fitlife-staging --timeout=5m

    - name: Run database migrations
      run: |
        kubectl exec deployment/fitlife-api -n fitlife-staging -- \
          dotnet ef database update --no-build

  deploy-production:
    name: Deploy to Production (Main Branch)
    runs-on: ubuntu-latest
    needs: [build-and-push-api, build-and-push-web]
    if: false  # Disabled until Azure resources are provisioned
    environment:
      name: production
      url: https://fitlife.example.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Set AKS context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ env.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ env.AKS_CLUSTER_NAME }}

    - name: Deploy to production
      run: |
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/api-deployment.yaml
        kubectl apply -f k8s/web-deployment.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/hpa.yaml
        
        # Update image tags
        kubectl set image deployment/fitlife-api api=${{ env.ACR_REGISTRY }}/${{ env.API_IMAGE_NAME }}:main-${{ github.sha }} -n fitlife
        kubectl set image deployment/fitlife-web web=${{ env.ACR_REGISTRY }}/${{ env.WEB_IMAGE_NAME }}:main-${{ github.sha }} -n fitlife
        
        # Wait for rollout
        kubectl rollout status deployment/fitlife-api -n fitlife --timeout=10m
        kubectl rollout status deployment/fitlife-web -n fitlife --timeout=10m

    - name: Run database migrations
      run: |
        kubectl exec deployment/fitlife-api -n fitlife -- \
          dotnet ef database update --no-build

    - name: Run smoke tests
      run: |
        # Wait for services to be ready
        sleep 30
        
        # Test API health endpoint
        kubectl run curl-test --image=curlimages/curl:latest --rm -i --restart=Never -n fitlife -- \
          curl -f http://fitlife-api-service/health || exit 1
        
        echo "✅ Production deployment successful!"
